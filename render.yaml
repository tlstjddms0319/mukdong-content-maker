services:
  - type: web
    name: mukdong-content-maker-0319
    runtime: node
    region: singapore
    plan: free
    # 빌드·실행 명령이 NODE_OPTIONS를 직접 정한다. #147이 환경 변수로 둔 힙 상한(320MB)은 빌드까지 막았고(타입 검사 중 heap OOM),
    # render.yaml에서 지워도 Render 서비스에 남은 환경 변수는 사라지지 않아 #150 뒤에도 같은 실패가 났다(2026-10-13).
    # 대시보드에서 NODE_OPTIONS를 지우지 않아도 되게, 빌드는 넉넉한 힙으로 돌고, 실행 상한은 startCommand 안에서만 건다(빌드에 영향 없음).
    # 실행: JS 힙 상한 320MB(카드 그리기 중 힙은 20MB 안팎이고 나머지는 sharp 바깥 메모리라, 상한은 GC를 일찍 돌게 하는 몫),
    # MALLOC_ARENA_MAX=2(glibc가 스레드마다 메모리 영역을 따로 잡아 sharp 사용 뒤 rss가 부풀던 것을 줄인다, sharp 문서 권장).
    # 메모리 보호는 카드 그리기 순서 대기와 sharp 제한(render/renderLock.ts·sharpSetup.ts)이 맡는다.
    buildCommand: export NODE_OPTIONS=--max-old-space-size=2048 && npm ci && npm run build
    startCommand: NODE_OPTIONS=--max-old-space-size=320 MALLOC_ARENA_MAX=2 npm start
    # 가벼운 헬스 체크(페이지를 그리지 않고 200만, api/health/route.ts).
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /tmp/mukdong-content-maker
      - key: AUTH_URL
        value: https://mukdong-content-maker-0319.onrender.com
      - key: MEDIA_PUBLIC_BASE_URL
        value: https://mukdong-content-maker-0319.onrender.com
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: HF_API_KEY_ID
        sync: false
      - key: HF_API_KEY_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GA4_PROPERTY_ID
        value: "555483214"
      - key: GA4_START_DATE
        value: "2026-09-07"
      - key: GA4_SERVICE_ACCOUNT_JSON
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        value: https://mukdong-content-maker-0319.onrender.com/api/instagram/callback
      - key: MEDIA_SIGNING_SECRET
        generateValue: true
      - key: INSTAGRAM_SCHEDULER_SECRET
        generateValue: true
      - key: INSTAGRAM_AUTOPUBLISH
        value: "on"
