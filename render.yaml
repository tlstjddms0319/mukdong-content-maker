services:
  - type: web
    name: mukdong-content-maker-0319
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    # 환경 변수 NODE_OPTIONS로 힙 상한을 두면 빌드(next build)에도 걸려 배포가 실패했다(2026-10-13, #147 뒤 두 번 실패).
    # 메모리 보호는 카드 그리기 순서 대기와 sharp 제한(render/renderLock.ts·sharpSetup.ts)이 맡고, 힙 상한은 두지 않는다.
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATA_DIR
        value: /tmp/mukdong-content-maker
      - key: AUTH_URL
        value: https://mukdong-content-maker-0319.onrender.com
      - key: MEDIA_PUBLIC_BASE_URL
        value: https://mukdong-content-maker-0319.onrender.com
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: HF_API_KEY_ID
        sync: false
      - key: HF_API_KEY_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GA4_PROPERTY_ID
        value: "555483214"
      - key: GA4_START_DATE
        value: "2026-09-07"
      - key: GA4_SERVICE_ACCOUNT_JSON
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        value: https://mukdong-content-maker-0319.onrender.com/api/instagram/callback
      - key: MEDIA_SIGNING_SECRET
        generateValue: true
      - key: INSTAGRAM_SCHEDULER_SECRET
        generateValue: true
      - key: INSTAGRAM_AUTOPUBLISH
        value: "on"
